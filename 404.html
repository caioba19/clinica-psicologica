<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PsicoManager — Página não encontrada</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg-main); padding: 24px;
    }
    body::before {
      content:''; position:fixed; width:600px; height:600px; border-radius:50%;
      background: radial-gradient(circle, rgba(92,184,168,0.08) 0%, transparent 70%);
      top:-150px; right:-150px; pointer-events:none;
    }
    .wrap {
      text-align: center; max-width: 480px;
      animation: fadeInUp .5s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    .code {
      font-family: var(--font-display); font-size: 120px; font-weight: 700; line-height: 1;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 8px;
    }
    .brain { font-size: 56px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px; }
    p  { font-size: 14.5px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 32px; }

    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 40px; }
    .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--primary-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .brand-name { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-icon">🧠</div>
      <span class="brand-name">PsicoManager</span>
    </div>
    <div class="brain">🔍</div>
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>A página que você está procurando não existe ou foi movida.<br>Verifique o endereço ou volte ao início.</p>
    <div class="btns">
      <a href="dashboard.html" class="btn-accent" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;padding:11px 24px;border-radius:8px;font-size:14px;font-weight:600">
        <i class="bi bi-grid-1x2"></i> Ir ao Dashboard
      </a>
      <button onclick="history.back()" class="btn-ghost" style="padding:11px 24px;font-size:14px">
        <i class="bi bi-arrow-left"></i> Voltar
      </button>
    </div>
  </div>
</body>
</html>
